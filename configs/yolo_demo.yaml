# 阶段 4 示例配置：YOLO 检测器 + 图片源（test_picture/ 下的开源样例缺陷图）
# 注意：使用本阶段在 NEU-DET 上微调的专属权重 best.pt（由 train_yolo.py 导出到项目根目录）。
# 权重体积大、不入库（见 .gitignore）：请先运行 python3 train_yolo.py 生成，或自行放置权重。
# 缺失时 load 抛 DetectorLoadError（阶段 4 §5.1）。
# input 字段见阶段 2 §4.4；detector.params 字段与默认值见阶段 4 §4.4
input:
  type: image
  dir: test_picture
detector:
  type: yolo
  params:
    model_path: best.pt      # NEU-DET 微调权重；不存在则 load 抛 DetectorLoadError
    conf_threshold: 0.25
    iou_threshold: 0.45
    device: cpu              # cpu / cuda / cuda:N
    imgsz: 640
